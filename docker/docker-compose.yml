services:
  kinova_haptic_humble:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kinova_haptic_humble
    network_mode: host
    privileged: true
    volumes:
      - ../src:/ros2_ws/src
      - /dev:/dev
    devices:
      - "/dev/ttyACM0:/dev/ttyACM0"   # ADD THIS BLOCK
    stdin_open: true
    tty: true