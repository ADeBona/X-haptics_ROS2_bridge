services:
  kinova_haptic_humble:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kinova_haptic_humble
    network_mode: host
    privileged: true
    volumes:
      - ../src:/ros2_ws/src
      - ../config:/config:ro
      - /dev:/dev
    environment:
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      #- CYCLONEDDS_URI=file:///config/cyclonedds.xml
      - ROS_DOMAIN_ID=0
    stdin_open: true
    tty: true