/kinova_haptic_bridge:
  ros__parameters:
    serial_port: "/dev/serial/by-id/usb-Arduino_UNO_WiFi_R4_CMSIS-DAP_F412FA654890-if01"
    auto_recover: true

    # Screw-torque extraction (screw_torque.py). Not yet confirmed empirically -
    # push the nut driver by hand, watch tau_raw/tau_screw/tau_perp_mag in the
    # CSV log, and adjust until tau_perp_mag stays small and tau_screw tracks
    # the applied twist cleanly.
    axis_vertical: 0
    axis_lateral: 1
    lever_L: 0.15
    lever_sign: 1
    tighten_sign: 1   # TODO confirm: +1 keeps tightening reading positive as-is,
                       # -1 flips it. See rows 339-377 vs 229-255 in the CSV log.

    # Pad mapping
    tau_deadband: 0.05
    tau_max: 2.0
    pressure_bias: 0.0
    pressure_span: 40.0

    # Tare (~/tare, ~/reset_tare)
    tare_samples: 20

    # Validation log - under /repo so it lands on the host Pi, not just the
    # container's writable layer (see docker/docker-compose.yml's `/repo` mount)
    csv_log_path: "/repo/logs/kinova_haptic_bridge_log.csv"
